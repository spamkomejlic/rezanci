<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f9ff"/>
      <stop offset="1" stop-color="#b9d7f1"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3274b8"/>
      <stop offset="1" stop-color="#114b83"/>
    </linearGradient>
    <clipPath id="body"><path d="M72 262a184 40 0 0 0 368 0c0 112-86 152-184 152S72 374 72 262z"/></clipPath>
    <clipPath id="pile"><path d="M104 262c0-66 64-112 152-112s152 46 152 112v40H104z"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <g id="art" transform="translate(0 -20)">
    <!-- steam -->
    <path d="M222 132c-12-14 12-24 0-38M290 132c-12-14 12-24 0-38" fill="none" stroke="#8fbbe2" stroke-width="9" stroke-linecap="round"/>

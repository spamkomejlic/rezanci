    <path d="M104 262c0-66 64-112 152-112s152 46 152 112v40H104z" fill="#fbd9a3"/>
    <g clip-path="url(#pile)" fill="none" stroke-linecap="round">
      <g stroke="#dd8e41" stroke-width="9">
        <path d="M205 174q17-22 34 0t34 0 34 0"/>
        <path d="M156 206q20-28 40 0t40 0 40 0 40 0 40 0"/>
        <path d="M124 242q22-30 44 0t44 0 44 0 44 0 44 0 44 0"/>
        <path d="M102 280q22-30 44 0t44 0 44 0 44 0 44 0 44 0 44 0"/>
      </g>
      <g stroke="#fff3dc" stroke-width="7">
        <path d="M176 191q20 22 40 0t40 0 40 0 40 0"/>
        <path d="M146 226q22 24 44 0t44 0 44 0 44 0 44 0"/>
        <path d="M114 262q22 24 44 0t44 0 44 0 44 0 44 0 44 0"/>
      </g>
    </g>
    <!-- bowl with a folk band: two lines, diamonds and dots -->
    <path d="M72 262a184 40 0 0 0 368 0c0 112-86 152-184 152S72 374 72 262z" fill="url(#clay)"/>
    <g clip-path="url(#body)">
      <path d="M60 314Q256 364 452 314M60 366Q256 414 452 366" fill="none" stroke="#fafdff" stroke-width="6"/>
      <path d="M136 331l15 17-15 17-15-17zM196 338l15 17-15 17-15-17zM256 340l15 17-15 17-15-17zM316 338l15 17-15 17-15-17zM376 331l15 17-15 17-15-17z" fill="#fafdff"/>
      <g fill="#f3c191"><circle cx="166" cy="352" r="6"/><circle cx="226" cy="357" r="6"/><circle cx="286" cy="357" r="6"/><circle cx="346" cy="352" r="6"/></g>
    </g>
    <path d="M72 262a184 40 0 0 0 368 0" fill="none" stroke="#fafdff" stroke-width="11" stroke-linecap="round"/>
    <!-- two noodles that hang over the rim -->
    <path d="M152 270c-8 20 8 30-2 48M356 272c8 18-8 28 2 44" fill="none" stroke="#fbd9a3" stroke-width="12" stroke-linecap="round"/>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8f3fd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1520" media="(prefers-color-scheme: dark)">
<title>rezanci</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="/"><span class="brand-mark"></span>rezanci</a>
    <button id="lang" class="chip" type="button"></button>
  </header>
  <main class="stack">
    <section class="card tint">
      <h1 data-t="join.title">Join the bag</h1>
      <p class="muted" data-t="join.lead">Type your name. The moderator sees it next to your phone.</p>
      <p id="status" class="status" role="status" aria-live="polite" hidden></p>
      <form id="form" class="stack">
        <label class="field"><span data-t="join.name">Your name</span>
          <input id="name" maxlength="40" autocomplete="given-name" enterkeyhint="go" required></label>
        <button id="go" class="btn wide" type="submit" data-t="join.go">Join</button>
      </form>
    </section>
  </main>
</div>
<script type="module" src="/join.js"></script>
</body>
</html>

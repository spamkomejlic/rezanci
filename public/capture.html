<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8f3fd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1520" media="(prefers-color-scheme: dark)">
<title>rezanci</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="/"><span class="brand-mark"></span>rezanci</a>
    <span id="operator" class="pill plain" hidden></span>
    <button id="lang" class="chip" type="button"></button>
  </header>
  <main class="stack">
    <p id="status" class="status" role="status" aria-live="polite" hidden></p>
    <!-- Photos on this phone that cannot go to the archive now: their bag is closed, or this phone is in a different bag. -->
    <p id="held" class="status bad" role="status" hidden></p>

    <!-- This phone has no bag: no session, bag closed, or removed by the moderator. -->
    <section id="ended" class="card tint" data-group="main" hidden>
      <h1 id="ended-text"></h1>
    </section>

    <div id="work" class="stack" data-group="main" hidden>
      <section class="card tint">
        <div class="row"><span class="eyebrow grow" data-t="cap.bag">Bag</span><span id="material" class="pill plain"></span></div>
        <div id="label" class="bag-label"></div>
        <p class="muted small" data-t="cap.check">Check that this is the label on the bag at your table.</p>
      </section>

      <!-- A photo that looks blurred or has a wrong exposure: the operator sees a part of it and decides. -->
      <section id="review" class="card" hidden>
        <h2 data-t="cap.review.title">Check this photo</h2>
        <p id="review-why" class="status bad"></p>
        <canvas id="review-crop" class="crop" width="512" height="512"></canvas>
        <p class="muted small" data-t="cap.review.lead">This is a part of the photo at full size.</p>
        <button id="retake" class="btn wide" type="button" data-t="cap.review.retake">Take it again</button>
        <button id="keep" class="btn ghost wide" type="button" data-t="cap.review.keep">Keep this photo</button>
      </section>

      <section class="card center">
        <input id="camera" type="file" accept="image/*" capture="environment" hidden>
        <button id="capture" class="shutter" type="button" data-t="cap.shoot">Capture</button>
        <p id="shot" class="status" role="status" aria-live="polite" hidden></p>
        <div class="stats two">
          <div class="stat"><b id="count">0</b><span data-t="cap.onphone">on this phone</span></div>
          <div class="stat"><b id="archived">0</b><span data-t="cap.archived">in the archive</span></div>
        </div>
        <p id="sync" class="status" role="status" aria-live="polite" hidden></p>
      </section>

      <section class="card">
        <h2 data-t="cap.done.title">Finished with this bag?</h2>
        <p id="done-lead" class="muted small"></p>
        <button id="done" class="btn soft wide" type="button"></button>
      </section>
    </div>
  </main>
</div>
<script type="module" src="/capture.js"></script>
</body>
</html>

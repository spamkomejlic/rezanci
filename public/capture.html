<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capture</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<h1>Capture</h1>
<p>Test version. Photos stay on this phone. Upload is not connected yet.</p>
<input id="camera" type="file" accept="image/*" capture="environment" hidden>
<button id="capture" class="big">Capture</button>
<p id="status" role="status" aria-live="polite"></p>
<p>On this phone: <strong id="count">0</strong> photos, <strong id="size">0</strong> MB.</p>
<button id="clear">Remove test photos</button>
<script type="module" src="/capture.js"></script>
</body>
</html>

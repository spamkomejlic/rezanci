<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8f3fd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1520" media="(prefers-color-scheme: dark)">
<title>rezanci</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/help/help.css">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="/"><span class="brand-mark"></span>rezanci</a>
    <a class="chip" href="/" data-t="h.back"></a>
    <button id="lang" class="chip" type="button"></button>
  </header>
  <main class="stack guide">
    <h1 data-t="h.op.t"></h1>
    <p class="muted" data-t="h.op.lead"></p>
    <section class="card step">
      <h2 data-t="h.op.s1.t"></h2>
      <p data-t="h.op.s1.p"></p>
      <img class="shot" data-shot="op-small" alt="">
    </section>
    <section class="card step">
      <h2 data-t="h.op.s2.t"></h2>
      <p data-t="h.op.s2.p"></p>
      <img class="shot" data-shot="op-home" alt="">
    </section>
    <section class="card step">
      <h2 data-t="h.op.s3.t"></h2>
      <p data-t="h.op.s3.p"></p>
      <img class="shot" data-shot="op-join" alt="">
    </section>
    <section class="card step">
      <h2 data-t="h.op.s4.t"></h2>
      <p data-t="h.op.s4.p"></p>
      <img class="shot" data-shot="op-capture" alt="">
    </section>
    <section class="card step">
      <h2 data-t="h.op.s5.t"></h2>
      <p data-t="h.op.s5.p"></p>
      <img class="shot" data-shot="op-sent" alt="">
    </section>
    <section class="card step">
      <h2 data-t="h.op.s6.t"></h2>
      <p data-t="h.op.s6.p"></p>
      <img class="shot" data-shot="op-review" alt="">
    </section>
    <section class="card step">
      <h2 data-t="h.op.s7.t"></h2>
      <p data-t="h.op.s7.p"></p>
      <img class="shot" data-shot="op-waiting" alt="">
    </section>
    <section class="card step">
      <h2 data-t="h.op.s8.t"></h2>
      <p data-t="h.op.s8.p"></p>
      <img class="shot" data-shot="op-done" alt="">
    </section>
    <section class="card step">
      <h2 data-t="h.op.s9.t"></h2>
      <p data-t="h.op.s9.p"></p>
      <img class="shot" data-shot="op-ended" alt="">
    </section>
    <section class="card">
      <h2 data-t="h.always"></h2>
      <ul class="marks yes"><li data-t="h.op.y1"></li><li data-t="h.op.y2"></li><li data-t="h.op.y3"></li></ul>
      <h2 data-t="h.never"></h2>
      <ul class="marks no"><li data-t="h.op.n1"></li><li data-t="h.op.n2"></li><li data-t="h.op.n3"></li></ul>
    </section>
    <section class="card">
      <h2 data-t="h.fix"></h2>
      <dl class="fix">
        <dt data-t="h.op.f1.q"></dt><dd data-t="h.op.f1.a"></dd>
        <dt data-t="h.op.f2.q"></dt><dd data-t="h.op.f2.a"></dd>
        <dt data-t="h.op.f3.q"></dt><dd data-t="h.op.f3.a"></dd>
        <dt data-t="h.op.f4.q"></dt><dd data-t="h.op.f4.a"></dd>
        <dt data-t="h.op.f5.q"></dt><dd data-t="h.op.f5.a"></dd>
      </dl>
      <img class="shot" data-shot="op-held" alt="">
    </section>
    <section class="card">
      <h2 data-t="h.more"></h2>
      <a class="btn soft wide" href="/help/moderator" data-t="h.link.mod"></a>
      <a class="btn ghost wide" href="/help/slides" data-t="h.link.slides"></a>
    </section>
  </main>
</div>
<script type="module" src="/help/page.js"></script>
</body>
</html>

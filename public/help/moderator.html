<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8f3fd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1520" media="(prefers-color-scheme: dark)">
<title>rezanci</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/help/help.css">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="/mod/"><span class="brand-mark"></span>rezanci</a>
    <a class="chip" href="/mod/" data-t="h.back"></a>
    <button id="lang" class="chip" type="button"></button>
  </header>
  <main class="stack guide">
    <h1 data-t="h.mod.t"></h1>
    <p class="muted" data-t="h.mod.lead"></p>
    <p class="muted" data-t="h.browser"></p>
    <section class="card step">
      <h2 data-t="h.mod.s1.t"></h2>
      <p data-t="h.mod.s1.p"></p>
      <img class="shot" data-shot="op-home" alt="">
    </section>
    <section class="card step">
      <h2 data-t="h.mod.s2.t"></h2>
      <p data-t="h.mod.s2.p"></p>
      <img class="shot" data-shot="mod-labels" alt="">
    </section>
    <section class="card step">
      <h2 data-t="h.mod.s3.t"></h2>
      <p data-t="h.mod.s3.p"></p>
      <img class="shot" data-shot="mod-open" alt="">
    </section>
    <section class="card step">
      <h2 data-t="h.mod.s4.t"></h2>
      <p data-t="h.mod.s4.p"></p>
      <img class="shot" data-shot="mod-qr" alt="">
    </section>
    <section class="card step">
      <h2 data-t="h.mod.s5.t"></h2>
      <p data-t="h.mod.s5.p"></p>
      <img class="shot" data-shot="mod-phones" alt="">
    </section>
    <section class="card step">
      <h2 data-t="h.mod.s6.t"></h2>
      <p data-t="h.mod.s6.p"></p>
      <img class="shot" data-shot="mod-grid" alt="">
      <img class="shot" data-shot="mod-view" alt="">
    </section>
    <section class="card step">
      <h2 data-t="h.mod.s7.t"></h2>
      <p data-t="h.mod.s7.p"></p>
      <img class="shot" data-shot="mod-blocked" alt="">
    </section>
    <section class="card step">
      <h2 data-t="h.mod.s8.t"></h2>
      <p data-t="h.mod.s8.p"></p>
      <img class="shot" data-shot="mod-ready" alt="">
    </section>
    <section class="card step">
      <h2 data-t="h.mod.s9.t"></h2>
      <p data-t="h.mod.s9.p"></p>
      <img class="shot" data-shot="mod-reopen" alt="">
    </section>
    <section class="card step">
      <h2 data-t="h.mod.s10.t"></h2>
      <p data-t="h.mod.s10.p"></p>
      <img class="shot" data-shot="mod-bags" alt="">
    </section>
    <section class="card">
      <h2 data-t="h.always"></h2>
      <ul class="marks yes"><li data-t="h.mod.y1"></li><li data-t="h.mod.y2"></li><li data-t="h.mod.y3"></li></ul>
      <h2 data-t="h.never"></h2>
      <ul class="marks no"><li data-t="h.mod.n1"></li><li data-t="h.mod.n2"></li><li data-t="h.mod.n3"></li></ul>
    </section>
    <section class="card">
      <h2 data-t="h.fix"></h2>
      <dl class="fix">
        <dt data-t="h.mod.f1.q"></dt><dd data-t="h.mod.f1.a"></dd>
        <dt data-t="h.mod.f2.q"></dt><dd data-t="h.mod.f2.a"></dd>
        <dt data-t="h.mod.f3.q"></dt><dd data-t="h.mod.f3.a"></dd>
        <dt data-t="h.mod.f4.q"></dt><dd data-t="h.mod.f4.a"></dd>
        <dt data-t="h.mod.f5.q"></dt><dd data-t="h.mod.f5.a"></dd>
        <dt data-t="h.mod.f6.q"></dt><dd data-t="h.mod.f6.a"></dd>
      </dl>
    </section>
    <section class="card">
      <h2 data-t="h.more"></h2>
      <a class="btn soft wide" href="/help/operator" data-t="h.link.op"></a>
      <a class="btn ghost wide" href="/help/slides" data-t="h.link.slides"></a>
    </section>
  </main>
</div>
<script type="module" src="/help/page.js"></script>
</body>
</html>

# Deploys the Worker on each push to main. The running code shows its commit at /api/health,
# so anyone can compare the live site with this repository.
name: deploy

on:
  push:
    branches: [main]

# The job can read the repository and nothing else.
permissions:
  contents: read

# One deploy at a time, in push order.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The deploy token is a secret of this environment. Only the main branch can use the environment.
    environment: production
    timeout-minutes: 10
    steps:
      # Actions are pinned to a full commit hash. A tag can move, a hash cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Exact versions from the lock file. Install scripts of packages do not run.
      - run: npm ci --ignore-scripts
      - run: npm test
      # Only this step gets the deploy token. The token can deploy the Worker and nothing else.
      - run: npx wrangler deploy --var "COMMIT:${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
